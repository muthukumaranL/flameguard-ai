# FlameGuard AI - training experiment configuration
#
# Every experiment fine-tunes COCO-pretrained weights on the leakage-repaired
# split (transfer learning; no model is ever used unchanged).
#
# COMPUTE BUDGET (measured, not assumed - disclosed in the report):
#   * GPU: GTX 1650 Ti, 4GB VRAM. Ultralytics auto-disables AMP on the GTX 16xx
#     series (known NaN-loss issue), so ALL training runs in FP32.
#   * YOLOv8n @640, batch 16 -> ~4.4 min/epoch (measured over 40 epochs).
#   * YOLOv8s @640, batch 8  -> needs ~7.8GB, i.e. ~2x the available VRAM. It
#     spills into shared system memory and collapses to ~20 min/epoch. It is
#     therefore run at batch 4 for a short, explicitly compute-limited budget.
#
# Because validation metrics are logged every epoch, models trained for
# different numbers of epochs are compared at EQUAL epochs (see report S7).

dataset_yaml: "data/processed/fire_smoke_resplit/data.yaml"
seed: 42
imgsz: 640
patience: 6
workers: 4

experiments:
  e1_baseline_v8n:
    model: "yolov8n.pt"
    epochs: 40
    batch: 16
    optimizer: "auto"
    save_dir: "outputs/training/e1_baseline_v8n"
    notes: "Baseline (COMPLETED: 40 epochs, 2h56m)."

  # Primary architecture comparison: same batch, same image size, same schedule
  # as the baseline, so the ONLY variable is the architecture itself.
  e3_compare_11n:
    model: "yolo11n.pt"
    epochs: 12
    batch: 16
    optimizer: "auto"
    save_dir: "outputs/training/e3_compare_11n"
    notes: "YOLO11n - newer architecture at the same cost class as YOLOv8n.
      Equal batch/imgsz to the baseline; compared at equal epochs."

  # Capacity probe: does a ~3.3x larger backbone help?  MEASURED VRAM COST of
  # YOLOv8s at 640px in FP32 on this 4GB card:
  #     batch 8 -> ~7.8 GB requested, 2.2 s/iter   (spilling to system RAM)
  #     batch 4 -> ~5.9 GB requested, 1.5 s/iter   (still spilling)
  #     batch 2 -> see below; the last batch size worth trying.
  # Anything that spills into shared memory over PCIe is not a fair experiment,
  # it is a measurement of the bus. Hence the very small batch and short budget.
  #     batch 2 -> ~1.0 GB, 6.7 it/s  <-- fits in VRAM; 15x faster per iteration.
  #
  # Two deliberate choices to keep this a fair capacity comparison:
  #   * 12 epochs, matching YOLO11n, so all three architectures can be compared at
  #     an equal epoch count (the baseline's per-epoch curve supplies its value).
  #   * The optimizer is NAMED. At batch 2 the iteration count crosses the
  #     threshold at which `auto` switches from AdamW to SGD, which would confound
  #     architecture with optimizer. Pinning AdamW at the same effective LR the
  #     other runs used (1.667e-3) removes that confound.
  # Batch size still differs (2 vs 16) because 4GB VRAM allows nothing else, and
  # that limitation is reported rather than papered over.
  e2_stronger_v8s:
    model: "yolov8s.pt"
    epochs: 18
    batch: 2
    optimizer: "AdamW"      # explicit: 'auto' would pick SGD at this batch size
    lr0: 0.001667           # the same effective LR every other run received
    save_dir: "outputs/training/e2_stronger_v8s"
    notes: "YOLOv8s (~11.2M params, 28.6 GFLOPs, ~3.3x the baseline's compute).
      COMPLETED at batch 2 - the only batch size that fits 4GB VRAM (measured:
      7.94GB at batch 8, 6.08GB at batch 4 spill to shared RAM; batch 2 = 1.0GB).
      Ultralytics gradient-accumulates to nbs=64 regardless, so the effective
      optimiser batch matches the other runs; only BatchNorm statistics see batch 2.
      Optimizer pinned to AdamW@1.667e-3 to match the other runs. 18 epochs; the
      per-epoch curve also supports an EQUAL-EPOCH (12) comparison with YOLO11n."

  # Tuning probes: equal-budget runs, each changing exactly ONE factor against
  # the control (e4d), so any difference is attributable to that factor.
  e4d_probe_baseline:
    model: "yolov8n.pt"
    epochs: 5
    batch: 16
    optimizer: "auto"
    save_dir: "outputs/training/e4d_probe_baseline"
    notes: "Probe CONTROL: default recipe at the probe budget."

  # NOTE (corrected after the fact): this probe was designed as "AdamW vs the
  # auto optimizer", but `optimizer: auto` ALREADY resolves to AdamW here. Naming
  # the optimizer explicitly changes only one thing - it stops Ultralytics from
  # discarding lr0. So what this probe actually tested is a LOWER LEARNING RATE
  # (1.0e-3 against the control's effective 1.667e-3). It is still a clean
  # single-variable probe; the variable is just not the one we first labelled it.
  e4a_probe_adamw:
    model: "yolov8n.pt"
    epochs: 5
    batch: 16
    optimizer: "AdamW"      # explicit, so lr0 below is honoured
    lr0: 0.001
    save_dir: "outputs/training/e4a_probe_adamw"
    notes: "Probe A: lower learning rate (effective 1.667e-3 -> 1.0e-3). The
      optimizer is AdamW in both arms; naming it explicitly is what makes lr0 apply."

  e4b_probe_augment:
    model: "yolov8n.pt"
    epochs: 5
    batch: 16
    optimizer: "auto"
    hsv_v: 0.6
    scale: 0.7
    mosaic: 1.0
    close_mosaic: 2
    save_dir: "outputs/training/e4b_probe_augment"
    notes: "Probe B: stronger photometric + scale augmentation (hsv_v 0.4->0.6,
      scale 0.5->0.7) for lighting robustness."

  e4c_probe_loss:
    model: "yolov8n.pt"
    epochs: 5
    batch: 16
    optimizer: "auto"
    cls: 1.0            # default 0.5
    save_dir: "outputs/training/e4c_probe_loss"
    notes: "Probe C: classification-loss weight doubled (0.5 -> 1.0)."

  # First attempt at the final model. KEPT AND REPORTED because it failed:
  # continuing from a converged checkpoint with a *fresh* schedule re-ran the LR
  # warm-up (back up to lr0) and re-enabled mosaic, which partly undid the
  # baseline. Best epoch was 1, then it degraded and early-stopped.
  e5a_naive_restart:
    model: "outputs/training/e1_baseline_v8n/weights/best.pt"
    epochs: 12
    batch: 16
    optimizer: "auto"
    lr0: 0.002
    cls: 1.0
    save_dir: "outputs/training/e5a_naive_restart"
    notes: "FAILED ATTEMPT (kept, reported): fresh schedule on a converged
      checkpoint - warm-up and mosaic restart undid it."

  # The fix. Two things had to change, and the second one is the subtle one:
  #
  #  1. Continuation is a polish, not a restart: no warm-up ramp, no mosaic, and
  #     a peak LR that picks up roughly where the baseline left off (the baseline
  #     ended at lr ~5.8e-5, so 1e-4 continues it rather than shocking it).
  #
  #  2. `optimizer: auto` SILENTLY DISCARDS lr0. Ultralytics logs
  #     "'optimizer=auto' found, ignoring 'lr0=...'" and substitutes its own
  #     (AdamW, lr=0.001667). That is fine when training from COCO - it is what
  #     the baseline used - but it is ~29x the LR the baseline finished at, which
  #     is exactly why the naive restart above degraded the model. The optimizer
  #     must therefore be named EXPLICITLY for the lr0 here to take effect.
  # Accuracy push (requested). YOLO11n is the strongest architecture per-epoch on
  # this data (0.435 mAP@0.5 by epoch 12 vs the YOLOv8n baseline's 0.314), and the
  # baseline never converged. This trains YOLO11n from COCO to convergence with the
  # winning probe setting (cls=1.0), same imgsz/batch as the baseline, and a longer
  # early-stopping patience so an 80-epoch budget is not cut short prematurely.
  e6_final_11n:
    model: "yolo11n.pt"
    epochs: 80
    batch: 8               # batch 16 spilled ~2GB into shared system RAM, which then
                           # collided with the mosaic dataloader and exhausted system
                           # memory. Batch 8 keeps YOLO11n fully inside 4GB VRAM.
    optimizer: "auto"      # resolves to AdamW here, matching the baseline
    cls: 1.0               # winning probe setting (Fire/Smoke separation)
    patience: 25           # let it converge; do not early-stop on a shallow plateau
    workers: 2             # fewer dataloader workers -> lower peak system-RAM use
    save_dir: "outputs/training/e6_final_11n"
    notes: "Accuracy push: YOLO11n from COCO, 80 epochs, cls=1.0, imgsz 640, batch 8
      (VRAM-safe), patience 25. Strongest per-epoch architecture; trained to convergence."

  # Recall+accuracy final (requested: "no missing fires" AND higher mAP than e5).
  # YOLO11n is the strongest architecture for mAP, but e6's cls=1.0 made it
  # conservative and cost recall. This run keeps YOLO11n but uses the DEFAULT
  # cls=0.5 (recall-friendly), trains longer (100 epochs) with a higher patience,
  # and box loss slightly raised to sharpen localisation. Target: beat e5_final on
  # BOTH recall (>0.454) and mAP@0.5 (>0.479).
  e7_final_11n_recall:
    model: "yolo11n.pt"
    epochs: 100
    batch: 8
    workers: 2
    optimizer: "auto"      # AdamW here
    cls: 0.5               # default - recovers recall vs e6's cls=1.0
    box: 8.0               # slightly above default 7.5 - tighter boxes
    patience: 30           # let it fully converge
    save_dir: "outputs/training/e7_final_11n_recall"
    notes: "Recall+accuracy final: YOLO11n, 100 epochs, cls=0.5 (recall-friendly),
      box=8.0, batch 8, patience 30. Aims to beat e5_final on BOTH recall and mAP."

  e5_final:
    model: "outputs/training/e1_baseline_v8n/weights/best.pt"
    epochs: 10
    batch: 16
    optimizer: "AdamW"      # explicit - 'auto' would override lr0 (see above)
    lr0: 0.0001             # baseline finished at ~5.8e-5; continue, don't shock
    lrf: 0.1                # decay to 1e-5 over the run
    warmup_epochs: 0.0      # no LR ramp back up
    mosaic: 0.0             # finish on realistic, un-tiled images
    cls: 1.0                # the change that won the probe study
    save_dir: "outputs/training/e5_final"
    notes: "Tuned final model - gentle continuation of the baseline checkpoint
      (explicit AdamW, lr0 1e-4 decaying to 1e-5, no warm-up, no mosaic) plus the
      winning cls=1.0 from the probe study."
